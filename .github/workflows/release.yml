name: Release

# Push a tag like v0.2.0 (it must match `version` in Cargo.toml) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: pwsh scripts/package.ps1
            asset: piTorrent-*-windows-x64.zip
          - os: ubuntu-22.04 # oldest LTS runner: the binary then runs on older glibc too
            package: sh scripts/package.sh
            asset: piTorrent-*-linux-*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1 | tr -d '\r')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $version"; exit 1; }
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Package
        run: ${{ matrix.package }}
      - name: Checksum
        shell: bash
        working-directory: dist
        run: sha256sum ${{ matrix.asset }} > "$(ls ${{ matrix.asset }} | head -n 1).sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/*.sha256
